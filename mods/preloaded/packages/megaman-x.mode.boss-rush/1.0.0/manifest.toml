format_version = 1
id = "megaman-x.mode.boss-rush"
version = "1.0.0"
name = "Mega Man X Boss Rush"
author = "mstan"
description = "Endless fights against two different Mavericks at once."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "requires-same-mods"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "boss_rush"
name = "Boss Rush"
description = "Adds Boss Rush to the game's title menu for solo or co-op. A run ends when the last player dies."
group = "Game Modes"
default_enabled = true

[[plugin]]
feature = "boss_rush"
id = "megaman-x.boss-rush"

[[feature]]
id = "x2_bosses"
name = "Boss Rush: X2 bosses"
description = "Include X2 bosses in Boss Rush. Currently limited to Wire Sponge (1 of 8). Requires Boss Rush and your X2 USA ROM; shares its ROM selection with X2 weapons."
group = "Game Modes"
default_enabled = false

[[resource]]
feature = "x2_bosses"
id = "x2-rom"
label = "Mega Man X2 ROM"
description = "Shared X2 source ROM, also used by X2 weapons. Currently supplies Wire Sponge."
format = "file"
file_patterns = "*.sfc,*.smc"
file_description = "Mega Man X2 USA ROM"
shared_key = "megaman-x.source.x2"
normalized_sha256 = "f3246755f608a1e1dc9c848b61da3b824c7853b29b3be40df6fc7f2793a887ed"
required = true

[[plugin]]
feature = "x2_bosses"
id = "megaman-x.boss-rush.x2-bosses"

[[feature]]
id = "x3_bosses"
name = "Boss Rush: X3 bosses"
description = "Include X3 bosses in Boss Rush. Currently limited to Tunnel Rhino (1 of 8). Requires Boss Rush and your X3 USA ROM; shares its ROM selection with Zero, co-op and X3 weapons."
group = "Game Modes"
default_enabled = false

[[resource]]
feature = "x3_bosses"
id = "x3-rom"
label = "Mega Man X3 ROM"
description = "Shared X3 source ROM, also used by Zero, co-op and X3 weapons. Currently supplies Tunnel Rhino."
format = "file"
file_patterns = "*.sfc,*.smc"
file_description = "Mega Man X3 USA ROM"
shared_key = "megaman-x.source.x3"
normalized_sha256 = "65b03268afac296330e8ff8d60dd0825879e13ed658b37713c034a3bd074f1d7"
required = true

[[plugin]]
feature = "x3_bosses"
id = "megaman-x.boss-rush.x3-bosses"
