format_version = 1
id = "megaman-x.coop"
version = "0.0.1"
name = "X / Zero Co-op"
author = "mstan"
description = "Play together as X and Zero with separate health and weapons."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "requires-same-mods"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "coop"
name = "Co-op"
description = "Player 2 joins automatically. Hold P2 Select for 1.5 seconds to leave; press Select to rejoin. Start opens each player's weapon menu. Selecting co-op turns off Add Zero."
group = "Characters"
default_enabled = false

[[option]]
feature = "coop"
id = "player1"
label = "Player 1 character"
description = "Player 2 plays as the other character."
type = "choice"
default = "x"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "zero"
label = "Zero"

[[option]]
feature = "coop"
id = "behavior"
label = "Zero behavior"
description = "Shared with Add Zero. Modern replaces Zero's buster with a direct saber and adds a double jump and air dash. Saber Zero (by RaphaelAzev) adds a Y-button Z-Saber with a 3-hit ground combo, air, wall and dash slashes, and the X3 finisher wave; tune it with Saber Zero settings. X1 Zero uses Project Zero player art and its higher jump with X1 buster combat. Special weapons remain available."
type = "choice"
default = "x3"
[[option.choice]]
value = "x3"
label = "X3 Behavior"
[[option.choice]]
value = "modern"
label = "Modern"
[[option.choice]]
value = "saber"
label = "Saber Zero"
[[option.choice]]
value = "x1"
label = "X1 Zero (Project Zero)"

[[option]]
feature = "coop"
id = "cameras"
label = "Netplay cameras"
description = "Unified keeps both players on one shared screen. Independent is experimental and may show graphics glitches or camera shaking. The host chooses for both peers. Local co-op display is a separate setting."
type = "choice"
default = "unified"
[[option.choice]]
value = "unified"
label = "Unified"
[[option.choice]]
value = "independent"
label = "Independent (Experimental)"

[[option]]
feature = "coop"
id = "local_cameras"
label = "Local co-op display"
description = "Unified shares one screen. Side by side gives each local player an independent camera and HUD, at 5:4 per screen by default. Widescreen applies to each screen; Adaptive fits each half of the window. Shared menus and story scenes appear in both screens. Requires a restart; online cameras are unchanged."
type = "choice"
default = "unified"
[[option.choice]]
value = "unified"
label = "Unified"
[[option.choice]]
value = "split"
label = "Side by side (Experimental)"

[[option]]
feature = "coop"
id = "hud"
label = "HUD layout"
description = "Compact stacks X above Zero in two aligned columns. Horizontal places all meters side by side."
type = "choice"
default = "compact"
[[option.choice]]
value = "compact"
label = "Compact"
[[option.choice]]
value = "horizontal"
label = "Horizontal"

[[resource]]
feature = "coop"
id = "x3-rom"
label = "Mega Man X3 ROM"
description = "Required for X3 Behavior, Modern and Saber Zero."
format = "file"
file_patterns = "*.sfc,*.smc"
file_description = "Mega Man X3 USA ROM"
shared_key = "megaman-x.source.x3"
normalized_sha256 = "65b03268afac296330e8ff8d60dd0825879e13ed658b37713c034a3bd074f1d7"
required = false

[[resource]]
feature = "coop"
id = "project-zero-ips"
label = "Project Zero IPS patch"
description = "For X1 Zero, select the v1.0 IPS extracted from the Project Zero ZIP. By CF, Falchion22 and Programer Peru."
format = "file"
file_patterns = "*.ips"
file_description = "Project Zero IPS"
shared_key = "megaman-x.source.project-zero"
size = 585458
normalized_sha256 = "060bc0b1900ac3541f0e5cebc48109a200a169290489662f6ede07660cc44ec5"
required = false

[[plugin]]
feature = "coop"
id = "megaman-x.coop"

# Claim the original character plugin too: features sharing a plugin are
# alternatives, so selecting co-op deselects Add Zero and vice versa.
[[plugin]]
feature = "coop"
id = "megaman-x.zero"
