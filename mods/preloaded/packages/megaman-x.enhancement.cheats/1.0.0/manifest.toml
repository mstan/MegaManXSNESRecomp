format_version = 1
id = "megaman-x.enhancement.cheats"
version = "1.0.0"
name = "Game Genie Cheats"
author = "GameGenie.com"
description = "Cheat presets for Mega Man X."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

# Source reference:
# https://gamegenie.com/cheats/gamegenie/snes/megamanx.html

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
