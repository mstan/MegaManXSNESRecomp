format_version = 1
id = "megaman-x.enhancement.widescreen"
version = "1.0.0"
name = "Mega Man X Widescreen"
author = "mstan"
description = "Custom widescreen renderer spike with adaptive stage rendering and HUD anchoring."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "widescreen"
name = "Widescreen (Extended view)"
description = "Extend the stage view with live enemies, preserved encounter timing, and anchored health bars."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "renderer"
label = "Renderer"
type = "choice"
default = "custom"
[[option.choice]]
value = "custom"
label = "Custom renderer (spike)"
[[option.choice]]
value = "legacy"
label = "Legacy widescreen"

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Custom renderer: adapt to the window, or select a fixed aspect ratio."
type = "choice"
default = "adaptive"
[[option.choice]]
value = "adaptive"
label = "Adaptive"
[[option.choice]]
value = "16:9"
label = "16:9"
[[option.choice]]
value = "21:9"
label = "21:9"
[[option.choice]]
value = "32:9"
label = "32:9"

[[option]]
feature = "widescreen"
id = "hud"
label = "HUD anchoring"
type = "choice"
default = "edges"
[[option.choice]]
value = "edges"
label = "Screen edges"
[[option.choice]]
value = "center"
label = "Native positions"

[[plugin]]
feature = "widescreen"
id = "megaman-x.widescreen"
