format_version = 1
id = "megaman-x.character.saber-zero"
version = "0.0.1"
name = "Saber Zero settings"
author = "RaphaelAzev"
description = "Tuning for Saber Zero by RaphaelAzev. Choose Saber Zero as the Zero behavior in Add Zero or Co-op to play it; these settings change its damage, hit priority, finisher window and sound. Saber sprites and sounds from the Zashiko Mod, for non-commercial use."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "requires-same-mods"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "saber-zero"
name = "Saber Zero settings"
description = "Applies when Zero behavior is Saber Zero in Add Zero or Co-op. Without these settings, Saber Zero uses the defaults shown here."
group = "Characters"
default_enabled = false

[[option]]
feature = "saber-zero"
id = "show_hitboxes"
label = "Show hitboxes"
description = "Debug: outline enemy, Zero and Saber attack hitboxes (custom renderer only)"
type = "boolean"
default = false

