format_version = 1
id = "megaman-x.enhancement.password-save"
version = "1.0.0"
name = "Mega Man X Password Saves"
author = "mstan"
description = "Remember the last password shown by the game and fill it in when you choose Password."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "password_save"
name = "Password Saves (SRAM)"
description = "Save passwords after stages and prefill the Password screen. With no file selected, creates mmx-password.srm beside the game."
group = "Saves"
default_enabled = false

[[resource]]
feature = "password_save"
id = "save_file"
label = "SRAM file"
description = "Choose an existing password save to use and update, or leave empty for mmx-password.srm beside the game."
format = "file"
file_patterns = "*.srm"
file_description = "Mega Man X password save"
required = false

[[plugin]]
feature = "password_save"
id = "megaman-x.password-save"
